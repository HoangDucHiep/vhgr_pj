# Cờ bật/tắt từng module của pipeline (Module A → I)
# Giá trị `enabled: false` sẽ bỏ qua module đó khi chạy `scripts/run_pipeline.py`.

modules:
  A_preprocess:
    enabled: true
    description: "Lọc bài, làm sạch wikitext, tách câu/đoạn, trích hyperlink"
  B_ner:
    enabled: true
    description: "Sinh nhãn bạc, train PhoBERT token classification, suy luận"
  C_coref:
    enabled: true
    description: "Giải thế danh xưng theo quy tắc R1-R5"
  D_re:
    enabled: true
    description: "Distant supervision Wikidata, train RE, merge triple"
  E_link:
    enabled: true
    description: "Alias + embedding BGE-M3 + rerank, sinh entity"
  F_graph:
    enabled: true
    description: "Dựng graph.jsonl, nạp Neo4j idempotent, validate"
  G_qa:
    enabled: true
    description: "Text-to-Cypher + trả lời có bằng chứng"
  I_evaluation:
    enabled: true
    description: "Auto-gold từ Wikidata, bộ QA, đo NER/RE/linking/QA"

split:
  # Chia tập THEO BÀI (không theo câu) để tránh rò rỉ ngữ cảnh.
  train: 0.8
  dev: 0.1
  test: 0.1
  seed: 42

kaggle:
  # Hạ tầng GPU offline (xem docs/CONTEXT.md §2.2, §2.7)
  username: ${KAGGLE_USERNAME:-hoangduchiep}
  dataset_slug: npl-vhgr-input
  enable_gpu: true
  enable_internet: true
  poll_interval_s: 60
  timeout_s: 7200

# Ngưỡng chất lượng dùng cho validate/đánh giá (nguồn: docs/CONTEXT.md §3)
thresholds:
  ner_f1: 0.85
  re_f1: 0.70
  linking_accuracy: 0.85
  qa_execution_accuracy: 0.70
  cypher_p95_ms: 2000
  evidence_coverage: 1.0
  min_articles: 2000
  max_articles: 5000
