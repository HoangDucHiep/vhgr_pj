seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  kb_dir: data/knowledge_base
  models_dir: models
  reports_dir: reports
  logs_dir: logs
  splits_dir: data/splits
  eval_dir: data/eval

dump:
  # Phiên bản dump viwiki dùng cố định (ghi vào mọi artifact).
  dump_version: "20261101"
  wiki_lang: vi
  dump_base_url: "https://dumps.wikimedia.org/viwiki"
  pages_articles: "viwiki-{dump_version}-pages-articles.xml.bz2"
  pages_meta_current: "viwiki-{dump_version}-pages-meta-current.xml.bz2"
  # viwiki KHÔNG có file redirects.xml.bz2 riêng; redirect nằm trong pages-articles (thẻ <redirect>).
  has_redirects_file: false

neo4j:
  uri: ${NEO4J_URI:-bolt://localhost:7687}
  user: ${NEO4J_USER:-neo4j}
  password: ${NEO4J_PASSWORD:-neo4jpass}
  database: ${NEO4J_DATABASE:-neo4j}
  read_only_user: ${NEO4J_READER_USER:-reader}
  read_only_password: ${NEO4J_READER_PASSWORD:-readerpass}
  batch_size: 500
  max_hops: 3
  max_limit: 100
  timeout_s: 10

llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  fallback_provider: groq
  fallback_model: openai/gpt-oss-20b
  api_key_env: GEMINI_API_KEY
  fallback_api_key_env: GROQ_API_KEY
  temperature: 0.0
  max_retries: 3
  timeout_s: 60
  rate_limit_per_min: 15
  cache_path: data/interim/llm_cache.sqlite
  bulk_extraction:
    method: kaggle_gpu
    model: Qwen/Qwen3-8B
    quantization: 4bit
    chunk_sentences_per_request: 15

ner:
  model_name: vinai/phobert-base
  max_len: 256
  batch_size: 32
  silver_link_min_anchor_match: 0.8
  labels: [PERSON, DYNASTY, EVENT, LOCATION, TIME, TITLE]
  # Đường dẫn artifact (tương đối repo root).
  silver_path: data/interim/ner_silver.jsonl
  splits_path: data/splits/splits.json
  predictions_path: data/interim/ner_predictions.jsonl
  # Huấn luyện (Phase 5) — seed cố định 42 theo AGENTS.md §5.6.
  train:
    model_name: vinai/phobert-base
    learning_rate: 3.0e-5
    epochs: 5
    batch_size: 32
    eval_batch_size: 64
    max_len: 256
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    early_stopping_patience: 2
    logging_steps: 100
    save_steps: 1000
    save_total_limit: 2
    seed: 42
  # Suy luận toàn corpus (Phase 5).
  infer:
    model_dir: models/ner
    batch_size: 64
    max_len: 256
    stride: 64
    score_threshold: 0.5

re:
  model_name: vinai/phobert-base
  marker_style: typed_markers
  max_len: 256
  batch_size: 32

link:
  embedding_model: BAAI/bge-m3
  dim: 1024
  top_k: 20
  context_weight:
    alias: 1.0
    context: 0.6
    temporal: 0.5
    dynasty: 0.5
    type: 0.4
    freq: 0.2

pipeline:
  stages: [A, B, C, D, E, F]
  skip: []
  entities_from: [infobox, wikidata]

# 18 quan hệ đóng của schema KG (nguồn sự thật: docs/CONTEXT.md §2.5)
relations:
  - cha_cua
