# Cấu hình LLM — Gemini (chính) + Groq (dự phòng)
# Quota free: Gemini 15 RPM / 500 RPD · Groq 30 RPM / 1000 RPD
# Lưu ý: gemini-2.0-flash, gemini-2.5-* đã bị retire. Groq đã retire llama-3.1-8b-instant,
# llama-3.3-70b-versatile.

providers:
  gemini:
    adapter: google_generativeai
    model: gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    rate_limit_per_min: 15
    requests_per_day: 500
    timeout_s: 60
    max_retries: 3
    backoff_base_s: 2.0

  groq:
    adapter: openai_compatible
    model: openai/gpt-oss-20b
    api_key_env: GROQ_API_KEY
    base_url: "https://api.groq.com/openai/v1"
    rate_limit_per_min: 30
    requests_per_day: 1000
    timeout_s: 60
    max_retries: 3
    backoff_base_s: 2.0

primary: gemini
fallback_order: [groq]

# Đường bulk: không tốn quota API, chạy trên Kaggle GPU.
bulk:
  method: kaggle_gpu
  model: Qwen/Qwen3-8B
  quantization: 4bit
  chunk_sentences_per_request: 15

# Cache SQLite tránh gọi lại cùng một prompt (idempotent LLM).
cache:
  enabled: true
  path: data/interim/llm_cache.sqlite
  hash_fields: [model, prompt, temperature, max_tokens]

# Ngưỡng cảnh báo quota hằng ngày.
quota:
  warn_ratio: 0.8
  hard_stop_ratio: 0.98
