services:
  neo4j:
    image: neo4j:5-community
    container_name: vhgr_neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4jpass}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_default__listen__address=0.0.0.0
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vhgr_backend
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_started
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      # `data/` chứa chunk + embedding + BM25 index (artifact offline) và
      # `data/eval/` (bộ câu hỏi đánh giá).
      - ./data:/app/data
      - ./configs:/app/configs
      # Cache HuggingFace dùng chung với máy host ⇒ container **không tải lại
      # model dense** (MiniLM ~470MB) mỗi lần rebuild ⇒ request đầu tiên
      # không treo 1–2 phút chờ mạng (đo được 17/11/2026: request treo ở
      # `huggingface_hub/file_download.py` ⇒ `retriever._ensure_dense_model`).
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface

  frontend:
    image: node:24-alpine
    container_name: vhgr_frontend
    working_dir: /app
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_API_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  neo4j_data:
  neo4j_logs:
  frontend_node_modules:
