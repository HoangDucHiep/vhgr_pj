[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: test cần hạ tầng ngoài (Neo4j, mạng) — chạy bằng `pytest -m integration`
    slow: test chạy lâu
