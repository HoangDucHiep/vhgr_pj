# ---------------------------------------------------------------------------
# Kết quả trận đánh → quan hệ `danh_bai` (winner → loser)
# ---------------------------------------------------------------------------
# Trường `ket qua` / `result` là **câu văn**, không phải tên node. Ta chỉ trích
# được khi cấu trúc câu rõ ràng:
#   - "<bên> chiến thắng"            → bên thắng
#   - "Chiến thắng của <bên>"        → bên thắng
#   - "<bên> thất bại"               → bên thua
# Bên thua được suy từ **bên tham chiến đối diện** (`ben 1`/`ben 2` hoặc
# `combatant1`/`combatant2`) — không có suy đoán ngoài dữ liệu.
battle_result:
  fields: [ket qua, result, outcome, ket qua va hau qua]
  #: Trường chứa hai bên tham chiến (theo thứ tự).
  sides_fields:
    vi: [ben 1, ben 2]
    en: [combatant1, combatant2]
  #: Mẫu câu → vị trí bên thắng / bên thua trong nhóm link.
  winner_patterns:
    - "chiến thắng"
    - "thắng lợi"
    - "thắng trận"
  loser_patterns:
    - "thất bại"
    - "bị đánh bại"
    - "bị đẹp"

