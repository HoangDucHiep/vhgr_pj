# Mapping trường infobox → quan hệ KG (Phase 3 — A4)
#
# Đây là **nguồn sự thật** cho mapping. Không hard-code trong code.
#
# Vì sao key là "đã bỏ dấu"?
#   `normalize_name()` (src/common/normalize.py) bỏ dấu, lowercase, gộp khoảng
#   trắng. Mọi key trong config phải viết theo đúng dạng đó:
#   "ngay sinh", "noi sinh", "mieu hieu"... (KHÔNG viết "ngày sinh").
#
# Vì sao không sửa `src/preprocess/infobox_parser.py`?
#   Module đó là hành vi Phase 1 — sửa nó sẽ đổi checksum corpus, vi phạm tính
#   tất định của Phase 1. Mọi mapping mở rộng nằm riêng ở file này.
#
# ---------------------------------------------------------------------------
# Spec của một field
# ---------------------------------------------------------------------------
#   relation:      tên quan hệ trong 18 quan hệ đóng (docs/04 §3.1)
#   kind:          "date" | "entity" | "period"
#       - date   : giá trị là ngày/tháng/năm của **chính chủ thể**
#       - entity : giá trị là một thực thể khác (người, nơi chốn, triều đại...)
#       - period : giá trị là khoảng thời gian (nhiệm kỳ) → 2 mốc start/end
#   value_type:    loại node của giá trị được trích
#   direction:     "forward" (mặc định) | "reverse" (đảo subject ↔ object)
#   prop:          tên thuộc tính node sinh ra (nếu có)
#   needs_gender:  quan hệ phụ thuộc giới tính chủ thể
#   object_types:  (tuỳ chọn) danh sách loại được phép cho *object*
#   link_mode:     "target" (mặc định) | "anchor" — lấy tên bài đích hay
#                  phần chữ hiển thị của liên kết wiki
#
# Quy tắc hướng (đã kiểm chứng trên corpus):
#   - `cha`  : giá trị là **cha**  → forward  (con → cha)
#   - `con trai`: giá trị là **con** → reverse  (con → cha)
#   - `ke nhiem` : giá trị là **kế nhiệm**  → forward  (tiền nhiệm → kế nhiệm)
#   - `tien nhiem`: giá trị là **tiền nhiệm** → reverse  (tiền nhiệm → kế nhiệm)
#   - `commander1`: giá trị là **chỉ huy** → reverse  (người → trận)
#   - `combatant1`: giá trị là **bên tham chiến** → reverse (người → trận)
#
# ---------------------------------------------------------------------------
# Fields
# ---------------------------------------------------------------------------
fields:
  # --- Ngày tháng của chính chủ thể ---
  sinh: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  ngay sinh: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  ngay sinh va tuoi: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  nam sinh va tuoi: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  nam sinh: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  birth_date: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  birthdate: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  date of birth: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}
  born: {relation: sinh_nam, kind: date, value_type: year, prop: birth_year}

  mat: {relation: mat_nam, kind: date, value_type: year, prop: death_year}
  ngay mat: {relation: mat_nam, kind: date, value_type: year, prop: death_year}
  ngay mat va tuoi: {relation: mat_nam, kind: date, value_type: year, prop: death_year}
  nam mat va tuoi: {relation: mat_nam, kind: date, value_type: year, prop: death_year}
  death_date: {relation: mat_nam, kind: date, value_type: year, prop: death_year}
  deathdate: {relation: mat_nam, kind: date, value_type: year, prop: death_year}
  date of death: {relation: mat_nam, kind: date, value_type: year, prop: death_year}
  died: {relation: mat_nam, kind: date, value_type: year, prop: death_year}

  # --- Nơi sinh / nơi mất ---
  noi sinh: {relation: sinh_tai, kind: entity, value_type: place}
  birth_place: {relation: sinh_tai, kind: entity, value_type: place}
  birthplace: {relation: sinh_tai, kind: entity, value_type: place}
  place of birth: {relation: sinh_tai, kind: entity, value_type: place}
  noi mat: {relation: mat_tai, kind: entity, value_type: place}
  death_place: {relation: mat_tai, kind: entity, value_type: place}
  deathplace: {relation: mat_tai, kind: entity, value_type: place}
  place of death: {relation: mat_tai, kind: entity, value_type: place}

  # --- Gia đình ---
  cha: {relation: cha_cua, kind: entity, value_type: person}
  father: {relation: cha_cua, kind: entity, value_type: person}
  me: {relation: me_cua, kind: entity, value_type: person}
  mother: {relation: me_cua, kind: entity, value_type: person}
  # `vo`/`chong` là quan hệ xác định → không cần đoán giới tính.
  vo: {relation: vo_cua, kind: entity, value_type: person}
  wife: {relation: vo_cua, kind: entity, value_type: person}
  chong: {relation: chong_cua, kind: entity, value_type: person}
  husband: {relation: chong_cua, kind: entity, value_type: person}
  phu quan: {relation: vo_cua, kind: entity, value_type: person}
  queen consort: {relation: vo_cua, kind: entity, value_type: person}
  # `spouse`/`consort`/`phoi ngau` không cho biết vị thế → cần giới tính chủ thể.
  spouse: {relation: vo_cua, kind: entity, value_type: person, needs_gender: true}
  consort: {relation: vo_cua, kind: entity, value_type: person, needs_gender: true}
  phoi ngau: {relation: vo_cua, kind: entity, value_type: person, needs_gender: true}
  anh em: {relation: anh_em_cua, kind: entity, value_type: person}
  sibling: {relation: anh_em_cua, kind: entity, value_type: person}
  em: {relation: anh_em_cua, kind: entity, value_type: person}
  con trai: {relation: cha_cua, kind: entity, value_type: person, direction: reverse}
  son: {relation: cha_cua, kind: entity, value_type: person, direction: reverse}
  con gai: {relation: me_cua, kind: entity, value_type: person, direction: reverse}
  daughter: {relation: me_cua, kind: entity, value_type: person, direction: reverse}
  # `con cai` = con (không rõ trê/gái) → dùng `cha_cua` (quan hệ cha mặc định
  # theo `docs/04` §3.1: con → cha). Đây là quy ước đã chốt, ghi trong
  # `docs/10-nhat-ky/phase-03.md` §3.
  con cai: {relation: cha_cua, kind: entity, value_type: person, direction: reverse}
  con: {relation: cha_cua, kind: entity, value_type: person, direction: reverse}

  # --- Triều đại / gia tộc ---
  trieu dai: {relation: thuoc_trieu_dai, kind: entity, value_type: dynasty}
  dynasty: {relation: thuoc_trieu_dai, kind: entity, value_type: dynasty}
  the: {relation: thuoc_trieu_dai, kind: entity, value_type: dynasty}
  hoang toc: {relation: thuoc_trieu_dai, kind: entity, value_type: dynasty}
  # `quoc gia` = quốc gia mà nhân vật cai trị ("[[Đại Việt]], [[Đại Ngu]]").
  # Theo `docs/04` §3.1, `thuoc_trieu_dai` là person/event → dynasty.
  quoc gia: {relation: thuoc_trieu_dai, kind: entity, value_type: dynasty}
  # `kieu hoang toc` = "Triều đại" / "Gia tộc" — dùng nhánh "goc" làm liên kết
  # chính xác hơn `hoang toc`.
  kieu hoang toc: {relation: thuoc_trieu_dai, kind: entity, value_type: dynasty}

  # --- Kế vị ---
  ke nhiem: {relation: ke_vi, kind: entity, value_type: person}
  successor: {relation: ke_vi, kind: entity, value_type: person}
  tien nhiem: {relation: ke_vi, kind: entity, value_type: person, direction: reverse}
  predecessor: {relation: ke_vi, kind: entity, value_type: person, direction: reverse}

  # --- Chức vụ / nghề nghiệp / tước hiệu ---
  chuc vi: {relation: giu_chuc_vu, kind: entity, value_type: title, link_mode: anchor}
  chuc quan: {relation: giu_chuc_vu, kind: entity, value_type: title, link_mode: anchor}
  office: {relation: giu_chuc_vu, kind: entity, value_type: title, link_mode: anchor}
  position: {relation: giu_chuc_vu, kind: entity, value_type: title, link_mode: anchor}
  tuoc vi: {relation: giu_chuc_vu, kind: entity, value_type: title, link_mode: anchor}
  nghe nghiep: {relation: giu_chuc_vu, kind: entity, value_type: title, link_mode: anchor}
  occupation: {relation: giu_chuc_vu, kind: entity, value_type: title, link_mode: anchor}

  # --- Thành lập (chủ thể là sự kiện/triều đại, người sáng lập là object) ---
  nguoi sang lap: {relation: lap_ra, kind: entity, value_type: person, direction: reverse, object_types: [dynasty, event]}
  founder: {relation: lap_ra, kind: entity, value_type: person, direction: reverse, object_types: [dynasty, event]}
  sang lap: {relation: lap_ra, kind: entity, value_type: person, direction: reverse, object_types: [dynasty, event]}

  # --- Chiến tranh / sự kiện ---
  place: {relation: dien_ra_tai, kind: entity, value_type: place}
  location: {relation: dien_ra_tai, kind: entity, value_type: place}
  dia diem: {relation: dien_ra_tai, kind: entity, value_type: place}
  commander1: {relation: chi_huy_tran, kind: entity, value_type: person, direction: reverse}
  commander2: {relation: chi_huy_tran, kind: entity, value_type: person, direction: reverse}
  # Infobox chiến tranh tiếng Việt dùng "chi huy 1/2" (người chỉ huy).
  chi huy 1: {relation: chi_huy_tran, kind: entity, value_type: person, direction: reverse}
  chi huy 2: {relation: chi_huy_tran, kind: entity, value_type: person, direction: reverse}
  combatant1: {relation: tham_gia_tran, kind: entity, value_type: person, direction: reverse, require_person: true}
  combatant2: {relation: tham_gia_tran, kind: entity, value_type: person, direction: reverse, require_person: true}
  # Infobox chiến tranh tiếng Việt dùng "ben 1/2" — nhưng đó là **tổ chức**
  # ("Nam Hán", "Tĩnh Hải quân"), không phải người. `docs/04` §3.1 quy định
  # `tham_gia_tran`: person ↔ event → không trích từ trường này.
  #
  # Trận đánh cổ: quan hệ `chi_huy_tran` với chủ thể là **người** cầm quân.
  # `danh_bai` (winner → loser) chỉ trích được khi `ket qua` có cấu trúc rõ,
  # xem `battle_result`.

# ---------------------------------------------------------------------------
# Date templates — cách đọc tham số của từng template ngày
# ---------------------------------------------------------------------------
# Mỗi mục: tên template (đã bỏ dấu) → spec
#   year/month/day: vị trí tham số (1-based) của năm/tháng/ngày
#   end_year/end_month/end_day: vị trí tham số của mốc cuối (nếu template chứa
#                                cả hai mốc, ví dụ "ngày mất và tuổi")
#   qualifier: template chỉ cho khoảng năm (circa) → gắn nhãn "khoảng"
#
# Quy ước chung:
#   - Tham số có từ khoá (df=y, df=yes) bị bỏ qua.
#   - Tham số rỗng bị bỏ qua.
#   - Tham số không phải số được giữ lại như "qualifier" (ví dụ "sau năm 1230").
date_templates:
  ngay sinh: {year: 1, month: 2, day: 3}
  ngay sinh va tuoi: {year: 1, month: 2, day: 3}
  nam sinh va tuoi: {year: 1, month: 2, day: 3}
  nam sinh: {year: 1, month: 2, day: 3}
  ngay mat: {year: 1, month: 2, day: 3, birth_year: 4, birth_month: 5, birth_day: 6}
  ngay mat va tuoi: {year: 1, month: 2, day: 3, birth_year: 4, birth_month: 5, birth_day: 6}
  nam mat va tuoi: {year: 1, month: 2, day: 3, birth_year: 4, birth_month: 5, birth_day: 6}
  death_date: {year: 1, month: 2, day: 3, birth_year: 4, birth_month: 5, birth_day: 6}
  death_date_and_age: {year: 1, month: 2, day: 3, birth_year: 4, birth_month: 5, birth_day: 6}
  death_year_and_age: {year: 1, month: 2, day: 3, birth_year: 4, birth_month: 5, birth_day: 6}
  birth_date: {year: 1, month: 2, day: 3}
  birthdate: {year: 1, month: 2, day: 3}
  birth_date_and_age: {year: 1, month: 2, day: 3}
  date_of_birth: {year: 1, month: 2, day: 3}
  bda: {year: 1, month: 2, day: 3}
  ngay_bat_dau_va_tuoi: {year: 1, month: 2, day: 3}
  nam_bat_dau_va_tuoi: {year: 1, month: 2, day: 3}
  ngay_thanh_lap_va_tuoi: {year: 1, month: 2, day: 3}
  start_date_and_age: {year: 1, month: 2, day: 3}
  start and end dates: {year: 1, month: 2, day: 3, end_year: 4, end_month: 5, end_day: 6}
  so nam theo nam va ngay: {year: 1, month: 2, day: 3, end_year: 4, end_month: 5, end_day: 6}
  circa: {year: 1, qualifier: true}

