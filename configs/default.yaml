seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  kb_dir: data/knowledge_base
  models_dir: models
  reports_dir: reports
  logs_dir: logs
  splits_dir: data/splits
  eval_dir: data/eval

dump:
  # Phiên bản dump viwiki dùng cố định (ghi vào mọi artifact).
  dump_version: "20261101"
  wiki_lang: vi
  dump_base_url: "https://dumps.wikimedia.org/viwiki"
  pages_articles: "viwiki-{dump_version}-pages-articles.xml.bz2"
  pages_meta_current: "viwiki-{dump_version}-pages-meta-current.xml.bz2"
  # viwiki KHÔNG có file redirects.xml.bz2 riêng; redirect nằm trong pages-articles (thẻ <redirect>).
  has_redirects_file: false

neo4j:
  uri: ${NEO4J_URI:-bolt://localhost:7687}
  user: ${NEO4J_USER:-neo4j}
  password: ${NEO4J_PASSWORD:-neo4jpass}
  database: ${NEO4J_DATABASE:-neo4j}
  read_only_user: ${NEO4J_READER_USER:-reader}
  read_only_password: ${NEO4J_READER_PASSWORD:-readerpass}
  batch_size: 500
  max_hops: 3
  max_limit: 100
  timeout_s: 10

llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  fallback_provider: groq
  fallback_model: openai/gpt-oss-20b
  api_key_env: GEMINI_API_KEY
  fallback_api_key_env: GROQ_API_KEY
  temperature: 0.0
  max_retries: 3
  timeout_s: 60
  rate_limit_per_min: 15
  cache_path: data/interim/llm_cache.sqlite
  bulk_extraction:
    method: kaggle_gpu
    model: Qwen/Qwen3-8B
    quantization: 4bit
    chunk_sentences_per_request: 15

ner:
  model_name: vinai/phobert-base
  max_len: 256
  batch_size: 32
  silver_link_min_anchor_match: 0.8
  labels: [PERSON, DYNASTY, EVENT, LOCATION, TIME, TITLE]
  # Đường dẫn artifact (tương đối repo root).
  silver_path: data/interim/ner_silver.jsonl
  splits_path: data/splits/splits.json
  predictions_path: data/interim/ner_predictions.jsonl
  # Huấn luyện (Phase 5) — seed cố định 42 theo AGENTS.md §5.6.
  train:
    model_name: vinai/phobert-base
    learning_rate: 3.0e-5
    epochs: 5
    batch_size: 32
    eval_batch_size: 64
    max_len: 256
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    early_stopping_patience: 2
    logging_steps: 100
    save_steps: 1000
    save_total_limit: 2
    seed: 42
  # Suy luận toàn corpus (Phase 5).
  infer:
    model_dir: models/ner
    batch_size: 64
    max_len: 256
    stride: 64
    score_threshold: 0.5

re:
  model_name: vinai/phobert-base
  marker_style: typed_markers
  max_len: 256
  batch_size: 32

  # --- Phase 8 (D1.2): mã hoá đầu vào mô hình RE ---
  # Mã hoá typed-marker: <s> subj </s> câu có «TYPE:SUBJ:name» ... «TYPE:OBJ:name» </s> obj </s>
  convert:
    max_len: 256
    # Số word ngữ cảnh giữ mỗi bên của hai mention (thu hẹp dần nếu vượt ngân sách).
    context_words: 48
  # Artifact đầu vào/đầu ra của Phase 8.
  encoded_path: data/interim/re_model_input.jsonl
  predictions_path: data/interim/re_phobert.jsonl
  llm_predictions_path: data/interim/re_llm.jsonl
  merged_path: data/interim/triples_merged.jsonl

  # --- Phase 8 (D1.2): huấn luyện mô hình RE đa nhãn ---
  train:
    model_name: vinai/phobert-base
    model_dir: models/re
    learning_rate: 3.0e-5
    epochs: 5
    batch_size: 32
    eval_batch_size: 64
    max_len: 256
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    early_stopping_patience: 2
    logging_steps: 100
    save_total_limit: 2
    seed: 42
    checkpoint_dir: models/_checkpoints

  # --- Phase 8: suy luận toàn corpus ---
  infer:
    model_dir: models/re
    batch_size: 64
    max_len: 256
    # Ngưỡng kích hoạt quan hệ (hiệu chỉnh trên dev trong train_re).
    threshold: 0.5
    # Ngưỡng đầu NA — dưới ngưỡng này mới coi là "có quan hệ".
    na_threshold: 0.5
    # Khoảng cách tối đa (token) giữa hai mention để sinh cặp ứng viên.
    max_pair_distance_tokens: 60

  # Hợp nhất triple (Phase 8 — D3).
  merge:
    # Ngưỡng confidence tối thiểu để giữ triple (0 = giữ tất cả).
    min_confidence: 0.0
    documents_path: data/interim/documents_clean.jsonl
    infobox_path: data/interim/infobox_triples.jsonl
    lead_path: data/interim/lead_triples.jsonl
    ds_path: data/interim/re_positive.jsonl
    phobert_path: data/interim/re_phobert.jsonl
    llm_path: data/interim/re_llm.jsonl
    llm_kaggle_path: data/interim/re_llm_kaggle.jsonl

  # --- Phase 7 (D1 phần 1): distant supervision ---
  # Bảng mapping property Wikidata → quan hệ KG (nguồn sự thật cho mapping).
  relations_config: configs/wikidata_relations.yaml
  # Artifact đầu vào/đầu ra của Phase 7.
  pairs_path: data/interim/wikidata_pairs.jsonl
  positive_path: data/interim/re_positive.jsonl
  train_path: data/interim/re_train.jsonl
  # Đầu vào grounding.
  coref_path: data/interim/coref_resolved.jsonl
  infobox_entities_path: data/interim/infobox_entities.jsonl
  infobox_triples_path: data/interim/infobox_triples.jsonl
  lead_triples_path: data/interim/lead_triples.jsonl
  splits_path: data/splits/splits.json
  # SPARQL: lô QID và nhịp nghỉ giữa các request.
  sparql_batch_size: 200
  sparql_min_interval_s: 0.4
  # Chia truy vấn theo 9 triều đại (docs/09 §Phase 7) — 1 triều đại timeout
  # không chặn cả phase.
  chunk_by_dynasty: true
  # Chỉ lấy negative khi cặp KHÔNG có quan hệ nào trong Wikidata (an toàn).
  safe_negatives_only: true
  # Ngưỡng Gate Phase 7 (đọc từ configs/wikidata_relations.yaml khi có).
  max_neg_pos_ratio: 1.0

coref:
  # Phase 6 — Coreference rule-based (C1/C2).
  # Đầu vào: NER của Phase 5 + documents của Phase 2 + infobox entities của Phase 3.
  predictions_path: data/interim/ner_predictions.jsonl
  documents_path: data/interim/documents.jsonl
  infobox_entities_path: data/interim/infobox_entities.jsonl
  qid_types_path: data/interim/qid_types.json
  splits_path: data/splits/splits.json
  output_path: data/interim/coref_resolved.jsonl
  article_subject_path: data/interim/article_subjects.jsonl
  honorifics_path: configs/honorifics.yaml
  gold_path: data/eval/coref_gold_100.jsonl
  # Dò thêm span danh xưng/đại từ mà NER không bắt (phần việc C1 thật sự).
  detect_pronouns: true
  # Sinh entity_id cho named mention chưa có trong gazetteer (D-044).
  mint_entity_ids: true
  # Điểm tin cậy gán cho nguồn khác nhau.
  score_gazetteer: 0.95
  score_mint: 0.75
  score_coref_pronoun: 0.70
  score_coref_honorific: 0.70
  score_article_subject: 0.60
  # Ngưỡng R5: đoạn có >= N entity PERSON mà đại từ không có ứng viên rõ -> ambiguous.
  max_persons_in_paragraph: 3
  # R4: chỉ gắn đại từ có giới tính khi biết chắc (props.gender / tiền tố tên).
  gender_strict: true
  # Thứ tự ưu tiên quy tắc giải quyết đại từ (D-052).
  # Đo bằng scripts/coref_ablation.py trên gold 100 câu (9 biến thể).
  #   r1a = ứng viên PERSON trong cùng câu
  #   r1b = ứng viên PERSON ở câu trước trong cùng đoạn
  #   r3  = chủ thể bài
  #   r5  = đoạn có >= N PERSON → ambiguous
  #   r6  = đoạn có đúng 1 PERSON → fallback
  #
  # Đo được: R3 đứng trước R1a làm G5 tốt nhất (0,8729 vs 0,8475).
  # Lưu ý: chênh lệch này KHÔNG có ý nghĩa thống kê (McNemar p=0,58) →
  # xem docs/10-nhat-ky/phase-06.md §4.2.
  pronoun_rule_order: [r3, r1a, r1b, r5, r6]
  # R1b chỉ dùng khi đoạn có đúng 1 người được nhắc (D-053).
  r1b_unique_only: false
  # R3 chỉ dùng khi đoạn không có PERSON nào (điều kiện trong docs/09 §Phase 6).
  # Mặc định false — biến thể bám sát đặc tả đo G5 thấp hơn (xem ablation).
  r3_requires_no_person: false
  # Số câu lấy mẫu cho bộ gold (nguồn: tập dev của splits.json).
  gold_size: 100

link:
  embedding_model: BAAI/bge-m3
  dim: 1024
  top_k: 20
  context_weight:
    alias: 1.0
    context: 0.6
    temporal: 0.5
    dynasty: 0.5
    type: 0.4
    freq: 0.2

pipeline:
  stages: [A, B, C, D, E, F]
  skip: []
  entities_from: [infobox, wikidata]

