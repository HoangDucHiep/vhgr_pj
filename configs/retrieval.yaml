# Phase 14 — Cấu hình tầng truy xuất (dùng chung cho arm A = Vanilla RAG
# và arm B = Hybrid GraphRAG ⇒ so sánh công bằng).
#
# Nguồn sự thật cho `src/qa/retriever.py` và `src/qa/embed_chunks.py`.

chunking:
  documents: data/interim/documents_clean.jsonl
  coref: data/interim/coref_resolved.jsonl
  chunks: data/interim/chunks.jsonl
  stats: data/interim/chunks_stats.json
  unit: paragraph          # 1 đoạn văn = 1 chunk
  min_chars: 1            # bỏ đoạn rỗng

embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dim: 384
  max_length: 256
  batch_size: 64
  pooling: mean
  normalize: true
  dtype: float16
  out: data/interim/chunk_embeddings.npy
  meta_out: data/interim/chunk_embeddings_meta.json

retrieval:
  top_k: 8                 # số chunk đưa vào context
  candidate_k: 50          # số candidate mỗi nhánh trước khi fusion

  bm25:
    k1: 1.5
    b: 0.75
    # Trọng số trường khi dựng "document" cho BM25.
    # Đo tối ưu trên 6 câu thật: chỉ-body trượt top-1, có boost thì top-1 đúng bài.
    field_weights:
      title: 3
      section: 2
      body: 1
    # Chỉ mục BM25 (CSR sparse) — build 1 lần offline, cache đĩa
    index: data/interim/bm25_index.npz
    index_meta: data/interim/bm25_index_meta.json
    # Ngưỡng: chunk không khớp từ khoá nào ⇒ không thuộc chủ đề
    min_keyword_hits: 1

  dense:
    enabled: true
    weight: 1.0
    max_query_chars: 512

  # Phase 19 — **đa dạng ngữ cảnh** (áp dụng cho cả 3 arm).
  #
  # Vì sao cần?
  # ----------
  # BM25 cộng trọng số `title` (×3) cho **mọi chunk của cùng bài** ⇒ chunk
  # "Di tích lịch sử" (lặp tên bài trong body) đè bằng chunk "Diễn biến"
  # thật sự trong narrative ⇒ trung bình 3,25 chunk/section chiếm top-8,
  # 14/60 câu gold section không lọt nổi top-8.
  #
  # Đo trên 60 câu narrative của `qa_rag_250.jsonl` (gold = `evidence_section`):
  #   cap=8,  không boost (cũ)        → 43/60 gold section trong top-8
  #   cap=2,  title_boost=1.0        → 53/60
  #   cap=2,  + section_boost=1.0    → **57/60**  (G19-2 cần ≥ 55)
  #   cap=2,  + noise_penalty=0.5    → 57/60 (không đổi, giữ chống nhiễu)
  diversity:
    # Số chunk tối đa lấy từ **một section** (doc_id, section_path)
    max_chunks_per_section: 2
    # Số chunk tối đa lấy từ **một bài** (chặn 1 bài chiếm >50% top-8)
    max_chunks_per_doc: 5
    # Nhân điểm RRF khi **tiêu đề bài** khớp câu hỏi ⇒ ưu tiên đúng bài
    title_boost: 1.0
    # "subset"  = tiêu đề phải ⊆ token câu hỏi (chặt, đo tốt nhất)
    # "overlap" = chỉ cần 1 token tiêu đề có trong câu hỏi (rộng hơn)
    title_boost_mode: subset
    # Bỏ qua boost nếu tiêu đề quá ngắn (tránh khớp bừa từ ngữ chung)
    title_boost_min_tokens: 2
    # Boost chunk nằm ở section có **tên khớp câu hỏi**
    # (vd. "Kể lại diễn biến X" ⇒ section "Diễn biến")
    section_boost: 1.0
    # Giảm điểm chunk ở section **nhiễu** ("Xem thêm", "Tham khảo",
    # "Liên kết > Tài liệu"…) ⇒ chúng không chiếm chỗ của chunk narrative
    noise_penalty: 0.5

  fusion:
    method: rrf             # reciprocal rank fusion
    k: 60                   # hằng số RRF
    # Ngưỡng: RRF score thấp hơn ⇒ coi như "không có trong dữ liệu"
    min_rrf_score: 0.005
    # Chunk cuối được giữ nếu điểm >= tỉ lệ này × điểm top-1
    relative_score_floor: 0.35

  # Token budget cho context (ước lượng 1 token ≈ 3 ký tự tiếng Việt)
  context_char_budget: 12000

  # D-122 — **Mở rộng ngữ cảnh cha** (parent expansion).
  #
  # Chunk trong corpus rất nhỏ (trung vị 248 ký tự, 20% dưới 100 ký tự) ⇒
  # câu hỏi "diễn biến trận X" chỉ truy xuất được các mảnh rời rạc, không
  # dựng được trình tự. Bổ sung **chunk anh em cùng section** để context có
  # mạch hồi chuyện liền mạch.
  #
  # Sửa ở tầng truy xuất ⇒ áp dụng cho **cả arm A và arm B** ⇒ so sánh
  # A vs B vẫn công bằng (khác biệt chỉ còn là KG).
  parent_expansion:
    enabled: true
    max_siblings: 3          # số chunk anh em lấy mỗi bên (trước/sau)
    max_parent_chars: 1400   # trần ký tự cho phần mở rộng của 1 chunk
    max_total_parents: 8     # trần **tổng** số chunk mở rộng cho 1 câu hỏi

generation:
  max_tokens: 900
  temperature: 0.0
  min_citations: 1
  faithfulness_retry: true
  max_faithfulness_retry: 1
  # Phase 19 — **retry khi LLM nói "không có" dù context có dữ liệu**.
  # Vì sao? Đo được: arm A nói "Không có trong dữ liệu" ở 16/60 câu narrative,
  # trong đó 7/16 câu gold section **vẫn nằm trong top-8 context** ⇒ lỗi ở
  # tầng sinh, không phải tầng truy xuất.
  no_data_retry: true
  max_no_data_retry: 1
